[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "Cal-IT2PW"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "matplotlib"]
[project.scripts]
calit2pw = "calit2pw:main"
[tool.setuptools]
py-modules = ["calit2pw"]
